services:
  backend:
    build:
      context: .
      args:
        PLAYWRIGHT_ENABLED: ${PLAYWRIGHT_ENABLED:-false}
    image: ai-coworker-backend
    env_file: .env
    # The backend's in-memory _running registry (backend/agent_loop.py) and
    # in-process SSE event bus (backend/events.py) are not multi-process
    # safe — running more than one replica would silently double-execute
    # tasks and split SSE subscribers across processes.
    deploy:
      replicas: 1
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
