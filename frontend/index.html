<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Coworker</title>
  <!--
    Tailwind via the Play CDN.

    NOTE on SRI: cdn.tailwindcss.com generates the JS bundle dynamically per
    request (it inspects the page and emits only the utility classes in use),
    so the response bytes are not stable and a Subresource Integrity hash
    cannot be pinned. A static `integrity` attribute on this URL would fail
    verification and the browser would refuse to execute the script — which
    is exactly what was breaking the app on first load.

    The script is loaded over HTTPS and pinned to the 3.4.1 path; for a
    stronger supply-chain guarantee, switch to a precompiled, content-stable
    Tailwind build (e.g. tailwindcss.css from cdnjs/jsdelivr at a fixed
    version) and reintroduce SRI there.
  -->
  <script src="https://cdn.tailwindcss.com/3.4.1"
          crossorigin="anonymous"></script>
  <style>
    body { background: #0f172a; color: #e2e8f0; }
    .status-pending  { color: #94a3b8; }
    .status-running  { color: #60a5fa; }
    .status-done     { color: #4ade80; }
    .status-failed   { color: #f87171; }
    .status-cancelled{ color: #fb923c; }
    #log-panel { font-family: monospace; font-size: 0.75rem; background: #0f172a; }
  </style>
</head>
<body class="min-h-screen p-6">

<div class="max-w-5xl mx-auto space-y-6">
  <!-- Header -->
  <div class="flex items-center justify-between">
    <h1 class="text-2xl font-bold text-white">AI Coworker</h1>
    <span id="conn-status" class="text-sm text-slate-400">—</span>
  </div>

  <!-- New task form -->
  <div class="bg-slate-800 rounded-xl p-5 space-y-4">
    <h2 class="font-semibold text-slate-200">New Task</h2>
    <input id="title-input" type="text" placeholder="Task title"
           class="w-full bg-slate-700 rounded-lg px-4 py-2 text-white placeholder-slate-400 border border-slate-600 focus:outline-none focus:border-blue-500" />
    <textarea id="prompt-input" rows="4" placeholder="Describe what the agent should do..."
              class="w-full bg-slate-700 rounded-lg px-4 py-2 text-white placeholder-slate-400 border border-slate-600 focus:outline-none focus:border-blue-500"></textarea>
    <input id="repo-input" type="text" placeholder="owner/repo (optional — uses default if blank)"
           class="w-full bg-slate-700 rounded-lg px-4 py-2 text-white placeholder-slate-400 border border-slate-600 focus:outline-none focus:border-blue-500" />
    <button onclick="createTask()"
            class="bg-blue-600 hover:bg-blue-500 text-white font-medium px-6 py-2 rounded-lg transition-colors">
      Run Agent
    </button>
    <p id="form-error" class="text-red-400 text-sm hidden"></p>
  </div>

  <!-- Task list -->
  <div id="task-list" class="space-y-3"></div>
</div>

<script>
// ---------------------------------------------------------------------------
// Security helpers — ALL dynamic content goes through these (F41/F42)
// ---------------------------------------------------------------------------

function escHtml(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

// Validate PR URL — only allow https://github.com/... to prevent javascript: hrefs (F42)
function safePrUrl(url) {
  if (!url) return null;
  try {
    const u = new URL(url);
    if (u.protocol !== 'https:') return null;
    if (!u.hostname.endsWith('github.com')) return null;
    return u.href;
  } catch { return null; }
}

// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------

const API = '/api';   // proxied through nginx — no direct port exposure
let tasks = [];
let activeStreams = {};

// ---------------------------------------------------------------------------
// Task creation
// ---------------------------------------------------------------------------

async function createTask() {
  const title  = document.getElementById('title-input').value.trim();
  const prompt = document.getElementById('prompt-input').value.trim();
  const repo   = document.getElementById('repo-input').value.trim() || null;
  const errEl  = document.getElementById('form-error');
  errEl.classList.add('hidden');

  if (!title || !prompt) {
    errEl.textContent = 'Title and prompt are required.';
    errEl.classList.remove('hidden');
    return;
  }
  if (prompt.length > 8000) {
    errEl.textContent = 'Prompt must be 8000 characters or less.';
    errEl.classList.remove('hidden');
    return;
  }
  if (repo && !/^[\w.-]+\/[\w.-]+$/.test(repo)) {
    errEl.textContent = 'Repo must be in owner/repo format.';
    errEl.classList.remove('hidden');
    return;
  }

  const headers = { 'Content-Type': 'application/json' };
  const apiKey = localStorage.getItem('api_key');
  if (apiKey) headers['Authorization'] = 'Bearer ' + apiKey;

  try {
    const r = await fetch(API + '/tasks', {
      method: 'POST',
      headers,
      body: JSON.stringify({ title, prompt, repo_url: repo })
    });
    if (r.status === 401) {
      const key = prompt('API key required:');
      if (key) { localStorage.setItem('api_key', key); }
      return;
    }
    if (!r.ok) {
      const j = await r.json().catch(() => ({}));
      errEl.textContent = 'Error: ' + escHtml(j.detail || r.statusText);
      errEl.classList.remove('hidden');
      return;
    }
    const task = await r.json();
    document.getElementById('title-input').value = '';
    document.getElementById('prompt-input').value = '';
    document.getElementById('repo-input').value = '';
    prependTask(task);
    subscribeSSE(task.id);
  } catch (e) {
    errEl.textContent = 'Network error: ' + escHtml(String(e));
    errEl.classList.remove('hidden');
  }
}

// ---------------------------------------------------------------------------
// Task rendering — all escHtml, safePrUrl for links
// ---------------------------------------------------------------------------

function renderTask(t) {
  const prUrl = safePrUrl(t.pr_url);
  const prLink = prUrl
    ? '<a href="' + escHtml(prUrl) + '" target="_blank" rel="noopener noreferrer" ' +
      'class="text-blue-400 hover:underline text-xs">View PR</a>'
    : '';

  return '<div id="task-' + escHtml(t.id) + '" class="bg-slate-800 rounded-xl p-4 space-y-2">' +
    '<div class="flex items-start justify-between gap-2">' +
      '<div>' +
        '<p class="font-medium text-white">' + escHtml(t.title) + '</p>' +
        '<p class="text-xs text-slate-400 mt-0.5">' + escHtml(t.id) + '</p>' +
      '</div>' +
      '<div class="flex items-center gap-3 shrink-0">' +
        prLink +
        '<span class="status-' + escHtml(t.status) + ' text-sm font-medium">' + escHtml(t.status) + '</span>' +
        (t.status === 'running' || t.status === 'pending'
          ? '<button onclick="cancelTask('' + escHtml(t.id) + '')" class="text-xs text-slate-400 hover:text-red-400">Cancel</button>'
          : '') +
      '</div>' +
    '</div>' +
    '<div id="log-' + escHtml(t.id) + '" class="text-xs text-slate-400 space-y-0.5 max-h-48 overflow-y-auto" id-panel="log-panel"></div>' +
  '</div>';
}

function prependTask(t) {
  tasks.unshift(t);
  const list = document.getElementById('task-list');
  list.insertAdjacentHTML('afterbegin', renderTask(t));
}

function updateTaskEl(taskId, updates) {
  const el = document.getElementById('task-' + taskId);
  if (!el) return;
  const updated = tasks.find(t => t.id === taskId);
  if (!updated) return;
  Object.assign(updated, updates);
  const tmp = document.createElement('div');
  tmp.innerHTML = renderTask(updated);
  el.replaceWith(tmp.firstElementChild);
}

function appendLog(taskId, message, level) {
  const el = document.getElementById('log-' + taskId);
  if (!el) return;
  const colours = { error: 'text-red-400', warning: 'text-yellow-400', info: 'text-slate-400' };
  const colour = colours[level] || 'text-slate-400';
  const line = document.createElement('p');
  line.className = colour;
  line.textContent = message;   // textContent — no XSS possible (F41)
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

// ---------------------------------------------------------------------------
// SSE subscription
// ---------------------------------------------------------------------------

function subscribeSSE(taskId) {
  if (activeStreams[taskId]) return;
  const es = new EventSource(API + '/tasks/' + encodeURIComponent(taskId) + '/stream');
  activeStreams[taskId] = es;

  const terminal = new Set(['task_done', 'task_failed', 'task_cancelled']);

  es.addEventListener('message', () => {});

  ['task_done','task_failed','task_cancelled','tool_start','tool_done','log','heartbeat'].forEach(evType => {
    es.addEventListener(evType, e => {
      let data = {};
      try { data = JSON.parse(e.data); } catch {}

      if (evType === 'log') {
        appendLog(taskId, data.message || '', data.level || 'info');
      } else if (evType === 'tool_start') {
        appendLog(taskId, 'Tool: ' + (data.tool || ''), 'info');
      } else if (evType === 'tool_done') {
        appendLog(taskId, 'Done: ' + (data.tool || '') + ' [' + (data.success ? 'ok' : 'fail') + ']', data.success ? 'info' : 'error');
      } else if (evType === 'task_done') {
        updateTaskEl(taskId, { status: 'done', pr_url: data.pr_url });
        appendLog(taskId, 'Task complete. PR: ' + (data.pr_url || '—'), 'info');
        es.close(); delete activeStreams[taskId];
      } else if (evType === 'task_failed') {
        updateTaskEl(taskId, { status: 'failed' });
        appendLog(taskId, 'Failed: ' + (data.error || 'unknown'), 'error');
        es.close(); delete activeStreams[taskId];
      } else if (evType === 'task_cancelled') {
        updateTaskEl(taskId, { status: 'cancelled' });
        es.close(); delete activeStreams[taskId];
      }
    });
  });

  es.onerror = () => {
    appendLog(taskId, 'Stream disconnected — reconnecting...', 'warning');
  };
}

// ---------------------------------------------------------------------------
// Cancel task
// ---------------------------------------------------------------------------

async function cancelTask(taskId) {
  const headers = {};
  const apiKey = localStorage.getItem('api_key');
  if (apiKey) headers['Authorization'] = 'Bearer ' + apiKey;
  await fetch(API + '/tasks/' + encodeURIComponent(taskId), { method: 'DELETE', headers });
  updateTaskEl(taskId, { status: 'cancelled' });
  if (activeStreams[taskId]) { activeStreams[taskId].close(); delete activeStreams[taskId]; }
}

// ---------------------------------------------------------------------------
// Load existing tasks on page load
// ---------------------------------------------------------------------------

async function loadTasks(offset = 0) {
  try {
    const r = await fetch(API + '/tasks?limit=50&offset=' + offset);
    if (!r.ok) return;
    const data = await r.json();
    const list = document.getElementById('task-list');
    if (offset === 0) { list.innerHTML = ''; tasks = []; }
    for (const t of (data.tasks || [])) {
      tasks.push(t);
      list.insertAdjacentHTML('beforeend', renderTask(t));
      if (t.status === 'running' || t.status === 'pending') subscribeSSE(t.id);
    }
    document.getElementById('conn-status').textContent = tasks.length + ' tasks loaded';
  } catch (e) {
    document.getElementById('conn-status').textContent = 'Offline';
  }
}

loadTasks();
</script>
</body>
</html>
