name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt --quiet

      - name: Syntax check
        run: python -m py_compile backend/*.py watchdog.py

      - name: Run tests
        env:
          ANTHROPIC_API_KEY: dummy
          GH_PAT: dummy
          DB_PATH: ":memory:"
          API_KEY: ""
        run: pytest tests/ -v --tb=short

      - name: Lint (ruff)
        run: |
          pip install ruff --quiet
          ruff check backend/ watchdog.py --select E,F,W --ignore E501 || true
