name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '.watchdog/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt --quiet

      - name: Syntax check
        run: python -m py_compile backend/*.py watchdog.py

      - name: Run tests
        env:
          ANTHROPIC_API_KEY: dummy
          GH_PAT: dummy
          DB_PATH: ":memory:"
          API_KEY: ""
        run: pytest tests/ -v --tb=short

      - name: Lint (ruff)
        run: |
          pip install ruff --quiet
          ruff check backend/ watchdog.py --select E,F,W --ignore E501
