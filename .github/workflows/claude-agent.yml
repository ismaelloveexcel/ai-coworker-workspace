name: Claude Autonomous Agent

on:
  # Trigger manually with a task prompt
  workflow_dispatch:
    inputs:
      task_title:
        description: "Task title"
        required: true
        type: string
      task_prompt:
        description: "What should the agent build or do?"
        required: true
        type: string
      target_repo:
        description: "Target repo (owner/repo) — defaults to this repo"
        required: false
        type: string

  # Trigger via API or issue label "agent-task"
  issues:
    types: [labeled]

jobs:
  run-agent:
    runs-on: ubuntu-latest
    # Hard ceiling so a slow / runaway agent fails fast instead of being
    # manually cancelled hours later. 25 steps × ~60s/step + overhead fits
    # comfortably in 45 minutes; bump if MAX_STEPS is increased.
    timeout-minutes: 45
    # F30: one run per repo at a time; don't cancel in-progress so we don't orphan branches
    concurrency:
      # Use github.event.inputs.* (not the inputs context) so this expression is
      # safe to evaluate on every event type. The `inputs` context is only
      # available in workflow_dispatch/workflow_call workflows; referencing it
      # here previously caused a workflow startup failure on non-dispatch events.
      group: agent-${{ github.repository }}-${{ github.event.inputs.target_repo || github.repository }}
      cancel-in-progress: false
    # Explicit allow-list guard: this workflow must only run for the two
    # event types it actually supports. Any other event_name (e.g. push or
    # synthetic dispatches from the Copilot agent on copilot/* branches)
    # must cause the job to be SKIPPED, not failed — otherwise we burn an
    # Actions minute and trigger watchdog noise. The `if:` evaluating to
    # false produces a clean skip at the job level.
    # For 'issues', additionally require the label to be exactly
    # 'agent-task' so unrelated label changes don't start an agent run.
    if: |
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'issues' && github.event.label.name == 'agent-task')

    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Extract task from issue (if triggered by issue)
        if: github.event_name == 'issues'
        id: issue-task
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          # F1: inputs passed via env vars — shell never re-parses ${{ }} expressions
          printf '%s' "$ISSUE_TITLE" | head -c 500 > /tmp/issue_title
          printf '%s' "$ISSUE_BODY"  | head -c 5000 > /tmp/issue_body
          echo "task_title=$(cat /tmp/issue_title)" >> $GITHUB_OUTPUT
          echo "task_body=$(cat /tmp/issue_body)"   >> $GITHUB_OUTPUT

      - name: Set up environment
        run: mkdir -p data

      - name: Run autonomous agent
        env:
          TASK_TITLE: ${{ github.event.inputs.task_title || steps.issue-task.outputs.task_title }}
          TASK_PROMPT: ${{ github.event.inputs.task_prompt || steps.issue-task.outputs.task_body }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_DEFAULT_REPO: ${{ github.event.inputs.target_repo || github.repository }}
          CLAUDE_MODEL: "claude-sonnet-4-5-20251022"
          MAX_STEPS: "25"
          STEP_TIMEOUT_SECONDS: "90"
          PLAYWRIGHT_ENABLED: "false"
          WHITELISTED_DOMAINS: "github.com"
        run: |
          python - << 'PYEOF'
          import asyncio
          import os
          import sys

          # Bootstrap DB
          sys.path.insert(0, ".")

          async def main():
              from backend import db
              from backend.agent_loop import run_task

              await db.init_db()

              task_title  = os.environ["TASK_TITLE"]
              task_prompt = os.environ["TASK_PROMPT"]
              repo        = os.getenv("GITHUB_DEFAULT_REPO", "")

              print(f"=== Starting agent task ===")
              print(f"Title:  {task_title}")
              print(f"Prompt: {task_prompt[:200]}...")
              print(f"Repo:   {repo}")

              task = await db.create_task(task_title, task_prompt, repo)
              task_id = task["id"]
              print(f"Task ID: {task_id}")

              await run_task(task_id)

              # Final status
              final = await db.get_task(task_id)
              print(f"\n=== Agent completed ===")
              print(f"Status:  {final['status']}")
              print(f"PR URL:  {final.get('pr_url','none')}")
              print(f"Branch:  {final.get('branch_name','none')}")

              steps = await db.get_steps(task_id)
              print(f"Steps:   {len(steps)}")

              if final["status"] == "failed":
                  logs = await db.get_logs(task_id)
                  errors = [l for l in logs if l["level"] == "error"]
                  for e in errors[-3:]:
                      print(f"ERROR: {e['message']}")
                  sys.exit(1)

              # Write summary for GitHub Actions summary
              with open(os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null"), "a") as f:
                  f.write(f"## ✅ Agent Task Complete\n\n")
                  f.write(f"**Title:** {task_title}\n\n")
                  f.write(f"**Status:** {final['status']}\n\n")
                  if final.get("pr_url"):
                      f.write(f"**PR:** [{final['pr_url']}]({final['pr_url']})\n\n")
                  f.write(f"**Steps executed:** {len(steps)}\n\n")

          asyncio.run(main())
          PYEOF

      - name: Comment on issue with result (if triggered by issue)
        if: github.event_name == 'issues' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const status = '${{ job.status }}' === 'success' ? '✅' : '❌';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `${status} Agent task **${{ job.status }}**.\n\nCheck the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for full logs.`
            });

