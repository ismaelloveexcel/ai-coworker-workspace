name: Maintenance

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Security audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --format=json --fail-on-vuln
      - name: Validate .env.example completeness
        run: |
          python - <<'EOF'
          import os, sys
          example = open('.env.example').read().splitlines()
          keys = [l.split('=')[0].strip() for l in example if l and not l.startswith('#')]
          missing = [k for k in keys if not os.environ.get(k)]
          if missing:
              print(f"WARNING: These .env.example keys are not set in CI env: {missing}")
          EOF
