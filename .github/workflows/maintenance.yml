name: Maintenance

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Security audit
        id: pip-audit
        run: |
          pip install pip-audit
          # pip-audit exits non-zero by default when vulnerabilities are
          # found; --strict additionally fails the run on dependency-collection
          # errors. The previous --fail-on-vuln flag does not exist in
          # pip-audit and caused this job to error out on every run.
          pip-audit -r requirements.txt --format=json --strict 2>&1 | tee /tmp/pip-audit-output.txt
      - name: Notify on security vulnerabilities (A17)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let auditOutput = '';
            try { auditOutput = fs.readFileSync('/tmp/pip-audit-output.txt', 'utf8').slice(0, 3000); } catch {}
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔒 Security vulnerabilities found in dependencies',
              body: `## Security Audit Alert\n\nThe weekly \`pip-audit\` check found vulnerabilities in \`requirements.txt\`.\n\n**Workflow run:** ${runUrl}\n\n<details><summary>pip-audit output</summary>\n\n\`\`\`\n${auditOutput}\n\`\`\`\n</details>\n\nPlease update the affected packages and close this issue.`,
              labels: ['security'],
            });
      - name: Validate .env.example completeness
        run: |
          python - <<'EOF'
          import os, sys
          example = open('.env.example').read().splitlines()
          keys = [l.split('=')[0].strip() for l in example if l and not l.startswith('#')]
          missing = [k for k in keys if not os.environ.get(k)]
          if missing:
              print(f"WARNING: These .env.example keys are not set in CI env: {missing}")
          EOF
