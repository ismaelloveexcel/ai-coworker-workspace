name: Maintenance

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Security audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --format=json
      - name: Validate .env.example completeness
        run: |
          python - <<'EOF'
          import os, sys
          example = open('.env.example').read().splitlines()
          keys = [l.split('=')[0].strip() for l in example if l and not l.startswith('#')]
          missing = [k for k in keys if not os.environ.get(k)]
          if missing:
              print(f"WARNING: These .env.example keys are not set in CI env: {missing}")
          EOF
